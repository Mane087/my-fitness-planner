<div
  class="absolute top-10 right-8 z-50 flex min-w-[300px] max-w-[420px] items-center justify-between gap-x-3 rounded-lg p-4 shadow-lg"
  role="alert"
  [ngClass]="config().container"
  [attr.id]="typeAlert()"
>
  <div
    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg"
    [ngClass]="config().iconClass"
  >
    <svg
      class="h-5 w-5"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="currentColor"
      viewBox="0 0 20 20"
    >
      <path [attr.d]="config().svgPath" />
    </svg>

    <span class="sr-only">{{ config().iconLabel }}</span>
  </div>

  <div class="flex-1 text-sm font-medium text-slate-700">
    {{ alertMessage() }}
  </div>

  <button
    type="button"
    class="inline-flex h-7 w-7 items-center justify-center rounded-lg text-slate-600 transition hover:bg-white/50 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-white cursor-pointer"
    aria-label="Cerrar alerta"
    (click)="dismissAlert()"
  >
    ✕
  </button>
</div>
