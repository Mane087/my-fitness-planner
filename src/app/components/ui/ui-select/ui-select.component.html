<div class="flex flex-col gap-1.5">
  <label [for]="selectId()" class="text-label text-text-secondary">{{ label() }}</label>

  <div
    class="relative flex items-center rounded-lg border bg-bg-surface text-text-tertiary"
    [class]="
      errorMessage()
        ? 'border-status-danger ring-1 ring-status-danger'
        : 'border-border-strong focus-within:border-accent-default focus-within:ring-1 focus-within:ring-accent-default'
    "
    [class.bg-bg-subtle]="isDisabled()"
  >
    <select
      [id]="selectId()"
      [value]="value()"
      [disabled]="isDisabled()"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      [attr.aria-describedby]="errorMessage() ? errorId : null"
      class="w-full cursor-pointer appearance-none rounded-lg bg-transparent py-2 pr-9 pl-3 text-body text-text-primary outline-none disabled:cursor-not-allowed disabled:text-text-tertiary"
      (change)="onSelect($event)"
      (blur)="onBlur()"
    >
      @if (placeholder(); as text) {
        <option value="" disabled [selected]="value() === ''">{{ text }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
    <app-ui-icon name="chevron-down" class="pointer-events-none absolute right-3" />
  </div>

  @if (errorMessage(); as message) {
    <p [id]="errorId" class="text-small text-status-danger">{{ message }}</p>
  }
</div>
