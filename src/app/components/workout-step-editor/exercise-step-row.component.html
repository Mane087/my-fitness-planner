<fieldset
  class="rounded-xl border bg-bg-surface p-4"
  [class]="
    errors().length > 0
      ? 'border-status-danger'
      : isSelected()
        ? 'border-accent-default ring-1 ring-accent-default'
        : 'border-border-default'
  "
  [attr.aria-invalid]="errors().length > 0 ? 'true' : null"
  (focusin)="selected.emit()"
  (click)="selected.emit()"
>
  <legend class="px-2 text-h3 text-text-primary">Paso {{ position() }} · Ejercicio</legend>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-6">
    <label class="flex flex-col gap-1 sm:col-span-2" [for]="idPrefix() + '-name'">
      <span class="text-label text-text-secondary">Ejercicio *</span>
      <input
        [id]="idPrefix() + '-name'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        [value]="step().name"
        placeholder="Ej. Box jump"
        (input)="setName($event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-sets'">
      <span class="text-label text-text-secondary">Series *</span>
      <input
        [id]="idPrefix() + '-sets'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        type="number"
        min="1"
        [value]="step().sets"
        (input)="setCount('sets', $event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-reps'">
      <span class="text-label text-text-secondary">Repeticiones *</span>
      <input
        [id]="idPrefix() + '-reps'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        type="number"
        min="1"
        [value]="step().reps"
        (input)="setCount('reps', $event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-load'">
      <span class="text-label text-text-secondary">Carga (kg)</span>
      <input
        [id]="idPrefix() + '-load'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        type="number"
        min="0"
        step="0.5"
        [value]="step().loadKg ?? null"
        (input)="setLoad($event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-rest'">
      <span class="text-label text-text-secondary">Descanso (s)</span>
      <input
        [id]="idPrefix() + '-rest'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        type="number"
        min="0"
        step="5"
        [value]="step().restSeconds ?? null"
        (input)="setRest($event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-rpe'">
      <span class="text-label text-text-secondary">RPE (1-10)</span>
      <input
        [id]="idPrefix() + '-rpe'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        type="number"
        min="1"
        max="10"
        [value]="step().target?.value ?? null"
        (input)="setRpe($event)"
      />
    </label>

    <label class="flex flex-col gap-1 sm:col-span-2 lg:col-span-5" [for]="idPrefix() + '-notes'">
      <span class="text-label text-text-secondary">Instrucciones</span>
      <textarea
        [id]="idPrefix() + '-notes'"
        class="rounded-lg border border-border-strong bg-bg-surface px-3 py-2 text-body text-text-primary focus-visible:border-accent-default focus-visible:ring-1 focus-visible:ring-accent-default focus-visible:outline-none"
        rows="2"
        [value]="step().notes ?? ''"
        (input)="setNotes($event)"
      ></textarea>
    </label>
  </div>

  @if (errors().length > 0) {
    <ul class="mt-3 list-disc pl-5 text-small text-status-danger" role="alert">
      @for (error of errors(); track error) {
        <li>{{ error }}</li>
      }
    </ul>
  }

  <div class="mt-4 flex flex-wrap justify-end gap-2">
    <app-ui-button
      variant="ghost"
      size="sm"
      [isDisabled]="!canMoveUp()"
      [ariaLabel]="'Subir paso ' + position()"
      (pressed)="moved.emit(-1)"
      >Subir</app-ui-button
    >
    <app-ui-button
      variant="ghost"
      size="sm"
      [isDisabled]="!canMoveDown()"
      [ariaLabel]="'Bajar paso ' + position()"
      (pressed)="moved.emit(1)"
      >Bajar</app-ui-button
    >
    <app-ui-button
      variant="danger"
      size="sm"
      [ariaLabel]="'Eliminar paso ' + position()"
      (pressed)="removed.emit()"
      >Eliminar</app-ui-button
    >
  </div>
</fieldset>
