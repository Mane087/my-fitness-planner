<fieldset
  class="rounded-2xl border border-slate-300 bg-white p-4"
  [attr.aria-invalid]="errors().length > 0 ? 'true' : null"
  [class.border-red-400]="errors().length > 0"
>
  <legend class="px-2 font-bold">Paso {{ position() }} · Ejercicio</legend>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-6">
    <label class="flex flex-col gap-1 sm:col-span-2" [for]="idPrefix() + '-name'">
      <span>Ejercicio *</span>
      <input
        [id]="idPrefix() + '-name'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        [value]="step().name"
        placeholder="Ej. Box jump"
        (input)="setName($event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-sets'">
      <span>Series *</span>
      <input
        [id]="idPrefix() + '-sets'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        type="number"
        min="1"
        [value]="step().sets"
        (input)="setCount('sets', $event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-reps'">
      <span>Repeticiones *</span>
      <input
        [id]="idPrefix() + '-reps'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        type="number"
        min="1"
        [value]="step().reps"
        (input)="setCount('reps', $event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-load'">
      <span>Carga (kg)</span>
      <input
        [id]="idPrefix() + '-load'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        type="number"
        min="0"
        step="0.5"
        [value]="step().loadKg ?? null"
        (input)="setLoad($event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-rest'">
      <span>Descanso (s)</span>
      <input
        [id]="idPrefix() + '-rest'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        type="number"
        min="0"
        step="5"
        [value]="step().restSeconds ?? null"
        (input)="setRest($event)"
      />
    </label>

    <label class="flex flex-col gap-1" [for]="idPrefix() + '-rpe'">
      <span>RPE (1-10)</span>
      <input
        [id]="idPrefix() + '-rpe'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        type="number"
        min="1"
        max="10"
        [value]="step().target?.value ?? null"
        (input)="setRpe($event)"
      />
    </label>

    <label class="flex flex-col gap-1 sm:col-span-2 lg:col-span-5" [for]="idPrefix() + '-notes'">
      <span>Instrucciones</span>
      <textarea
        [id]="idPrefix() + '-notes'"
        class="rounded-lg border border-slate-300 px-3 py-2"
        rows="2"
        [value]="step().notes ?? ''"
        (input)="setNotes($event)"
      ></textarea>
    </label>
  </div>

  @if (errors().length > 0) {
    <ul class="mt-3 list-disc pl-5 text-sm text-red-700" role="alert">
      @for (error of errors(); track error) {
        <li>{{ error }}</li>
      }
    </ul>
  }

  <div class="mt-4 flex flex-wrap justify-end gap-2">
    <button
      type="button"
      class="rounded-lg border px-3 py-2 disabled:opacity-40"
      [disabled]="!canMoveUp()"
      [attr.aria-label]="'Subir paso ' + position()"
      (click)="moved.emit(-1)"
    >
      Subir
    </button>
    <button
      type="button"
      class="rounded-lg border px-3 py-2 disabled:opacity-40"
      [disabled]="!canMoveDown()"
      [attr.aria-label]="'Bajar paso ' + position()"
      (click)="moved.emit(1)"
    >
      Bajar
    </button>
    <button
      type="button"
      class="rounded-lg border border-red-300 px-3 py-2 text-red-700"
      [attr.aria-label]="'Eliminar paso ' + position()"
      (click)="removed.emit()"
    >
      Eliminar
    </button>
  </div>
</fieldset>
