<div class="flex min-h-svh bg-bg-canvas text-text-primary">
  <aside
    class="fixed inset-x-0 bottom-0 z-40 sm:sticky sm:top-0 sm:flex sm:h-svh sm:shrink-0 sm:flex-col sm:gap-8 sm:border-r sm:border-border-default sm:bg-bg-surface sm:px-4 sm:py-6"
    [class]="isRail() ? 'sm:w-18 sm:items-center' : 'sm:w-58'"
  >
    <a
      routerLink="/"
      class="hidden items-center gap-2.5 rounded-lg focus-visible:ring-3 focus-visible:ring-accent-muted focus-visible:outline-none sm:flex"
      [class]="isRail() ? '' : 'px-2'"
      [attr.aria-label]="isRail() ? 'MyFitnessPlanner, inicio' : null"
    >
      <span
        class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-accent-default text-text-on-accent"
      >
        <app-ui-icon name="zap" [size]="18" />
      </span>
      @if (!isRail()) {
        <span class="text-h3 text-text-primary">MyFitnessPlanner</span>
      }
    </a>

    <nav
      aria-label="Navegación principal"
      class="flex border-t border-border-default bg-bg-surface px-4 pt-1 pb-[max(0.5rem,env(safe-area-inset-bottom))] sm:flex-col sm:gap-1 sm:border-t-0 sm:bg-transparent sm:p-0"
    >
      @for (item of navigationItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          ariaCurrentWhenActive="page"
          class="flex flex-1 flex-col items-center justify-center gap-1 rounded-lg py-2 text-label focus-visible:ring-3 focus-visible:ring-accent-muted focus-visible:outline-none sm:flex-none sm:flex-row sm:justify-start sm:gap-3 sm:text-body"
          [class]="
            (link.isActive
              ? 'text-text-accent sm:bg-accent-subtle sm:font-semibold'
              : 'text-text-tertiary hover:bg-bg-subtle sm:text-text-secondary') +
            (isRail() ? ' sm:size-10 sm:flex-none sm:justify-center sm:p-0' : ' sm:px-3 sm:py-2.5')
          "
        >
          <app-ui-icon
            [name]="item.icon"
            [size]="20"
            [class]="link.isActive ? '' : 'sm:text-text-tertiary'"
          />
          <span [class]="isRail() ? 'sm:sr-only' : ''">{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (!isRail()) {
      <app-sidebar-week-summary class="hidden sm:block" />
    }
  </aside>

  <div class="min-w-0 flex-1 pb-20 sm:pb-0">
    <router-outlet />
  </div>
</div>
