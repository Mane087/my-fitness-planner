@if (showModal()) {
  <div class="fixed inset-0 z-50 bg-black/50" aria-hidden="true"></div>
  <div class="fixed inset-0 z-50 flex items-center justify-center px-4">
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="labelledBy()"
      tabindex="-1"
      data-testid="modal-surface"
      class="max-h-[90svh] w-full max-w-lg overflow-y-auto rounded-xl bg-white p-6 text-slate-950 shadow-lg"
    >
      <ng-content></ng-content>
    </div>
  </div>
}
