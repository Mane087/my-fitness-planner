@let card = workout();
<button
  type="button"
  class="workout-card border-l-4 text-left"
  [ngClass]="card.colorClass"
  [class.opacity-60]="card.status === 'skipped'"
  [attr.aria-label]="card.title + ', ' + card.statusLabel"
  (click)="opened.emit(card.id)"
>
  <span class="text-[0.65rem] font-bold uppercase tracking-wide text-slate-400"
    >{{ card.sportLabel }} · {{ card.categoryLabel }}</span
  >
  <span
    class="block truncate text-xs font-semibold text-slate-50"
    [class.line-through]="card.status === 'skipped'"
    >{{ card.title }}</span
  >
  @if (card.status !== 'planned') {
    <span
      class="mt-0.5 inline-block rounded-full px-1.5 text-[0.65rem] font-bold"
      [ngClass]="
        card.status === 'completed'
          ? 'bg-emerald-900 text-emerald-200'
          : 'bg-slate-700 text-slate-200'
      "
      >{{ card.status === 'completed' ? '✓ ' : '' }}{{ card.statusLabel }}</span
    >
  }
  <span class="block text-[0.7rem] text-slate-300">
    @if (card.actualDurationLabel) {
      Tiempo: {{ card.actualDurationLabel }} de
      {{ card.durationLabel }}
    } @else {
      Tiempo: {{ card.durationLabel }}
    }
  </span>
  <span class="block text-[0.7rem] text-slate-300">
    @if (card.actualDistanceLabel && card.hasPlannedDistance) {
      Distancia: {{ card.actualDistanceLabel }} de
      {{ card.distanceLabel }}
    } @else if (card.actualDistanceLabel) {
      Distancia: {{ card.actualDistanceLabel }}
    } @else {
      Distancia: {{ card.distanceLabel }}
    }
  </span>
</button>
