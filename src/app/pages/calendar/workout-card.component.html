@let card = workout();
<button
  type="button"
  [class]="classes()"
  [attr.aria-label]="card.title + ', ' + card.statusLabel"
  (click)="opened.emit(card.id)"
>
  <span class="flex w-full items-center gap-1.5 text-text-tertiary">
    <app-ui-icon [name]="sportIcon()" [size]="layout() === 'day' ? 16 : 14" />
    <span class="text-caps min-w-0 truncate">{{ card.categoryLabel }}</span>
    @if (isCompleted()) {
      <app-ui-icon name="circle-check" [size]="14" class="ml-auto text-status-success" />
    }
  </span>
  <span
    class="break-words text-text-primary"
    [class]="layout() === 'day' ? 'text-h3' : 'text-body font-semibold'"
    >{{ card.title }}</span
  >
  @if (card.summaryText) {
    <span class="text-label w-full rounded-md bg-bg-subtle px-2 py-1.5 text-text-secondary">{{
      card.summaryText
    }}</span>
  } @else {
    <app-workout-profile [class]="profileClass()" [steps]="card.steps" [sport]="card.sport" />
  }
  <span class="flex items-baseline gap-1.5">
    <span class="font-metric text-metric-m text-text-primary">{{ card.durationClock }}</span>
    @if (card.distanceKmLabel) {
      <span class="text-small text-text-secondary">{{ card.distanceKmLabel }} km</span>
    }
  </span>
  @if (card.actualDurationLabel) {
    <span class="text-small text-text-secondary">
      Real: {{ card.actualDurationLabel }}
      @if (card.actualDistanceLabel) {
        · {{ card.actualDistanceLabel }}
      }
    </span>
  }
  @if (isSkipped()) {
    <span class="text-label text-text-tertiary">{{ card.statusLabel }}</span>
  }
</button>
