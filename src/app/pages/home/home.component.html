<main class="hero min-h-svh bg-slate-950 text-white">
  <section
    class="relative isolate flex min-h-svh items-center overflow-hidden px-6 py-20 sm:px-10 lg:px-16"
  >
    <div class="absolute inset-0 -z-10 bg-black/60" aria-hidden="true"></div>

    <div class="mx-auto w-full max-w-6xl text-center sm:text-left">
      <p class="mb-4 text-sm font-semibold uppercase tracking-[0.24em] text-text-focused">
        Cycling workout planner
      </p>

      <h1 class="max-w-3xl text-4xl font-bold leading-tight tracking-tight sm:text-5xl lg:text-6xl">
        Plan Your Cycling Training
      </h1>

      <p class="mt-6 max-w-2xl text-lg leading-8 text-text-secondary sm:text-xl">
        Build structured rides, organize your training calendar, and stay focused on every goal from
        base miles to race day.
      </p>

      <div class="mt-10 flex justify-center sm:justify-start">
        <a
          routerLink="/calendar"
          class="inline-flex min-h-11 items-center justify-center rounded-full bg-btn-primary px-7 py-3 text-base font-semibold text-text-secondary shadow-lg shadow-cyan-950/30 transition hover:bg-btn-primary-hover focus:outline-none focus-visible:ring-4 focus-visible:ring-btn-primary-hover focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 cursor-pointer"
          aria-label="Go to the training calendar"
        >
          Go to Training Calendar
        </a>
      </div>
    </div>
  </section>
</main>
