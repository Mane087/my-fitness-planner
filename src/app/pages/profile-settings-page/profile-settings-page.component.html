<main class="relative min-h-dvh bg-slate-950 px-4 py-5 text-slate-100">
  @if (showSuccessAlert()) {
    <app-alert
      [typeAlert]="typeAlert()"
      [alertMessage]="alertMessage()"
      (showAlert)="closeSuccessAlert($event)"
    />
  }
  <section class="mx-auto flex w-full max-w-6xl flex-col gap-4">
    <header class="flex items-center sm:flex-row sm:items-center sm:justify-between">
      <h2 class="text-4xl font-bold tracking-tight">Datos del perfil</h2>
      <a
        routerLink="/"
        class="text-sm font-semibold text-cyan-200 hover:text-cyan-100 flex items-center gap-x-2"
      >
        <img src="/icons/back.svg" alt="" />
        Volver al inicio
      </a>
    </header>

    @if (loading()) {
      <div class="rounded-2xl bg-white/10 p-6 text-center">Cargando configuración...</div>
    } @else {
      <form class="flex flex-col gap-8" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <section class="rounded-3xl bg-white p-6 text-slate-950 shadow-xl shadow-black/20">
          <div class="grid gap-6 grid-cols-3">
            <app-input-form
              formControlName="name"
              labelText="Usuario"
              inputId="profile-name"
              inputPlaceholder="Tu nombre"
            />

            <app-input-form
              formControlName="maxHeartRate"
              labelText="FC máxima (ppm)"
              inputType="number"
              inputId="max-heart-rate"
              inputPlaceholder="100-250"
            />

            <app-input-form
              formControlName="weightKg"
              labelText="Peso (kg)"
              inputType="number"
              inputId="weight-kg"
              inputPlaceholder="80"
            />

            <app-select
              [options]="weekStartOptions"
              formControlName="weekStartsOn"
              label="Inicio de la semana"
              titleSelect="Inicio de la semana"
            />

            <app-select
              [options]="sportOptions"
              formControlName="preferredSport"
              label="Deporte principal"
              titleSelect="Deporte principal"
            />
            <app-select
              [options]="intensityMetricOptions"
              formControlName="preferredIntensityMetric"
              label="Métrica de entrenamiento"
              titleSelect="Métrica de entrenamiento"
            />
          </div>
        </section>
        <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
          <app-button
            label="Cancelar"
            title="Cancelar"
            variant="secondary"
            (pressed)="cancel()"
            [disabled]="saving()"
          />
          <app-button
            [label]="saving() ? 'Guardando...' : 'Guardar cambios'"
            title="Guardar"
            kind="action"
            htmlType="submit"
            variant="primary"
            [disabled]="saving()"
          />
        </div>
      </form>
    }

    <!-- Outside the loading block: reloading the profile after an import must keep these components. -->
    <app-zone-sets-section [profileMaxHeartRate]="savedMaxHeartRate()" />
    <app-backup-section (imported)="onBackupImported()" />
  </section>
</main>
