<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyFitnessPlanner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applies an explicit theme before the first paint. `system` is left to prefers-color-scheme in CSS.
      // The key must match THEME_STORAGE_KEY in theme.service.ts.
      (function () {
        try {
          var theme = localStorage.getItem('theme-preference');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
